<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Research Paper Assistant</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171923;
    --panel-2: #1e212d;
    --border: #2a2d3a;
    --text: #e8e9ed;
    --text-dim: #9aa0ac;
    --accent: #6366f1;
    --accent-hover: #4f52d6;
    --user-bubble: #6366f1;
    --bot-bubble: #23263355;
    --success: #22c55e;
    --danger: #f87171;
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", Inter, Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top left, #171a24, var(--bg));
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    flex-shrink: 0;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 22px;
  }
  .logo .icon {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 18px 0 10px;
  }

  .upload-box {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 18px 14px;
    text-align: center;
    cursor: pointer;
    transition: 0.15s ease;
    background: var(--panel-2);
  }
  .upload-box:hover { border-color: var(--accent); background: #1c1f2c; }
  .upload-box input { display: none; }
  .upload-box p { margin: 6px 0 0; font-size: 13px; color: var(--text-dim); }
  .upload-box .file-name { font-size: 12px; color: var(--accent); margin-top: 4px; word-break: break-all; }

  #uploadBtn {
    width: 100%; margin-top: 10px; padding: 10px;
    border: none; border-radius: 10px; background: var(--accent);
    color: #fff; font-weight: 600; font-size: 13px; cursor: pointer;
    transition: 0.15s ease;
  }
  #uploadBtn:hover { background: var(--accent-hover); }
  #uploadBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  #uploadStatus { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .status-ok { color: var(--success); }
  .status-err { color: var(--danger); }

  .doc-list { flex: 1; overflow-y: auto; margin-top: 4px; }
  .doc-item {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; margin-bottom: 6px;
    font-size: 12.5px; color: var(--text);
  }
  .doc-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .empty-hint { font-size: 12.5px; color: var(--text-dim); font-style: italic; }

  #resetBtn {
    width: 100%; padding: 9px; margin-top: 10px;
    border: 1px solid var(--border); border-radius: 10px;
    background: transparent; color: var(--text-dim);
    font-size: 12.5px; cursor: pointer; transition: 0.15s ease;
  }
  #resetBtn:hover { border-color: var(--danger); color: var(--danger); }

  /* ---------- Main chat area ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .topbar p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-dim); }

  #chat {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .welcome {
    margin: auto; text-align: center; color: var(--text-dim); max-width: 380px;
  }
  .welcome .icon { font-size: 40px; margin-bottom: 10px; }
  .welcome h2 { color: var(--text); font-size: 17px; margin: 0 0 6px; }
  .welcome p { font-size: 13px; line-height: 1.5; }

  .msg-row { display: flex; gap: 10px; max-width: 75%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .avatar.bot { background: linear-gradient(135deg, var(--accent), #a855f7); }
  .avatar.user { background: #2f3341; }

  .bubble {
    padding: 12px 15px; border-radius: var(--radius);
    font-size: 14.5px; line-height: 1.55;
  }
  .msg-row.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
  .msg-row.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { margin: 6px 0 0; padding-left: 18px; }
  .bubble li { margin-bottom: 4px; }
  .bubble strong { color: #c7c9ff; }
  .msg-row.user .bubble strong { color: #fff; }

  .sources {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 6px;
  }
  .source-chip {
    background: #26293a; border-radius: 6px; padding: 3px 8px;
  }

  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .input-bar {
    padding: 16px 24px 20px; border-top: 1px solid var(--border);
  }
  .input-wrap {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 14px; padding: 6px 8px 6px 16px;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  #questionInput {
    flex: 1; border: none; background: transparent; color: var(--text);
    font-size: 14.5px; padding: 10px 0; outline: none;
  }
  #questionInput::placeholder { color: var(--text-dim); }
  #sendBtn {
    width: 38px; height: 38px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    flex-shrink: 0; transition: 0.15s ease;
  }
  #sendBtn:hover { background: var(--accent-hover); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  #errorBanner {
    display: none; margin: 0 24px 10px; padding: 9px 14px;
    background: #2a1519; border: 1px solid #4a1f26; color: var(--danger);
    border-radius: 10px; font-size: 13px;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #333748; border-radius: 4px; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo"><div class="icon">📄</div> Research Assistant</div>

  <div class="section-title">Upload Paper</div>
  <label class="upload-box" id="dropArea">
    <input type="file" id="fileInput" accept="application/pdf" onchange="onFileChosen()" />
    <div style="font-size:22px;">⬆️</div>
    <p>Click to choose a PDF</p>
    <div class="file-name" id="fileName"></div>
  </label>
  <button id="uploadBtn" onclick="uploadFile()" disabled>Upload &amp; Index</button>
  <div id="uploadStatus"></div>

  <div class="section-title">Your Papers</div>
  <div class="doc-list" id="docsList"><div class="empty-hint">No papers uploaded yet.</div></div>

  <button id="resetBtn" onclick="resetAll()">Clear all data</button>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <h1>Ask your papers</h1>
      <p>Answers are grounded only in the documents you upload.</p>
    </div>
  </div>

  <div id="chat">
    <div class="welcome" id="welcomeMsg">
      <div class="icon">💬</div>
      <h2>Start a conversation</h2>
      <p>Upload a research paper on the left, then ask things like
      "Summarize this paper" or "What methodology is used?"</p>
    </div>
  </div>

  <div id="errorBanner"></div>

  <div class="input-bar">
    <div class="input-wrap">
      <input type="text" id="questionInput" placeholder="Ask a question about your papers..."
             onkeydown="if(event.key==='Enter') askQuestion()" />
      <button id="sendBtn" onclick="askQuestion()">➤</button>
    </div>
  </div>
</main>

<script>
const API = "";

function onFileChosen() {
  const input = document.getElementById("fileInput");
  const nameEl = document.getElementById("fileName");
  const btn = document.getElementById("uploadBtn");
  if (input.files.length) {
    nameEl.textContent = input.files[0].name;
    btn.disabled = false;
  }
}

async function refreshDocs() {
  const res = await fetch(API + "/documents");
  const data = await res.json();
  const el = document.getElementById("docsList");
  el.innerHTML = data.documents.length
    ? data.documents.map(d => `<div class="doc-item"><span class="dot"></span>${escapeHtml(d)}</div>`).join("")
    : `<div class="empty-hint">No papers uploaded yet.</div>`;
}

async function uploadFile() {
  const input = document.getElementById("fileInput");
  const statusEl = document.getElementById("uploadStatus");
  const btn = document.getElementById("uploadBtn");
  if (!input.files.length) return;

  btn.disabled = true;
  statusEl.className = "";
  statusEl.textContent = "Uploading and indexing...";

  const formData = new FormData();
  formData.append("file", input.files[0]);

  try {
    const res = await fetch(API + "/upload", { method: "POST", body: formData });
    const data = await res.json();
    if (!res.ok) {
      statusEl.className = "status-err";
      statusEl.textContent = data.detail;
      btn.disabled = false;
      return;
    }
    statusEl.className = "status-ok";
    statusEl.textContent = `Indexed successfully (${data.chunks_added} chunks).`;
    input.value = "";
    document.getElementById("fileName").textContent = "";
    refreshDocs();
  } catch (e) {
    statusEl.className = "status-err";
    statusEl.textContent = "Upload failed. Check your connection.";
    btn.disabled = false;
  }
}

function showError(msg) {
  const el = document.getElementById("errorBanner");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 4000);
}

function removeWelcome() {
  const w = document.getElementById("welcomeMsg");
  if (w) w.remove();
}

function addUserMessage(text) {
  removeWelcome();
  const chat = document.getElementById("chat");
  const row = document.createElement("div");
  row.className = "msg-row user";
  row.innerHTML = `<div class="avatar user">🧑</div><div class="bubble">${escapeHtml(text)}</div>`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function addTypingIndicator() {
  const chat = document.getElementById("chat");
  const row = document.createElement("div");
  row.className = "msg-row bot";
  row.id = "typingRow";
  row.innerHTML = `<div class="avatar bot">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function renderMarkdownLite(text) {
  // Clean up stray whitespace and markdown, produce clean HTML.
  let cleaned = text
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")   // **bold**
    .replace(/^[•\-]\s+/gm, "-BULLET-")                     // normalize bullets
    .trim();

  const lines = cleaned.split(/\n+/).map(l => l.trim()).filter(Boolean);
  let html = "";
  let inList = false;

  for (const line of lines) {
    if (line.startsWith("-BULLET-")) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${line.replace("-BULLET-", "").trim()}</li>`;
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      html += `<p>${line}</p>`;
    }
  }
  if (inList) html += "</ul>";
  return html;
}

function addBotMessage(answer, sources) {
  const row = document.getElementById("typingRow");
  const sourcesHtml = sources && sources.length
    ? `<div class="sources">${sources.map(s => `<span class="source-chip">${escapeHtml(s.file)} · p.${s.page}</span>`).join("")}</div>`
    : "";
  row.id = "";
  row.querySelector(".bubble").innerHTML = renderMarkdownLite(answer) + sourcesHtml;
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
}

async function askQuestion() {
  const input = document.getElementById("questionInput");
  const question = input.value.trim();
  if (!question) { showError("Please type a question first."); return; }

  addUserMessage(question);
  input.value = "";
  addTypingIndicator();

  try {
    const res = await fetch(API + "/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    if (!res.ok) {
      document.getElementById("typingRow")?.remove();
      showError(data.detail || "Something went wrong.");
      return;
    }
    addBotMessage(data.answer, data.sources);
  } catch (e) {
    document.getElementById("typingRow")?.remove();
    showError("Request failed. Is the server running?");
  }
}

async function resetAll() {
  if (!confirm("This will delete all uploaded papers and chat history. Continue?")) return;
  await fetch(API + "/reset", { method: "POST" });
  document.getElementById("chat").innerHTML = `
    <div class="welcome" id="welcomeMsg">
      <div class="icon">💬</div>
      <h2>Start a conversation</h2>
      <p>Upload a research paper on the left, then ask things like
      "Summarize this paper" or "What methodology is used?"</p>
    </div>`;
  document.getElementById("uploadStatus").textContent = "";
  refreshDocs();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.innerText = str;
  return div.innerHTML;
}

refreshDocs();
</script>
</body>
</html>
